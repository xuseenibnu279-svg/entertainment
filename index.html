<!DOCTYPE html>
<html>
<head>
    <title>Entertainment Videos</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #101010;
            color: white;
        }
        header {
            background: #202020;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #00e676;
        }
        .video {
            background: #222;
            margin: 15px;
            padding: 20px;
            border-radius: 12px;
        }
        button {
            background: #00e676;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
        }
    </style>
</head>
<body>

<header>
    <h1>Entertainment</h1>
    <p>Welcome to our video platform</p>
</header>

<div class="video">
    <h2>Welcome!</h2>
    <p>Watch your favourite entertainment videos.</p>
    <button><button onclick="document.querySelectorAll('.video')[1].scrollIntoView()">Watch Videos</button>Watch Videos</button>
</div>

<div class="video">
    <h2>Latest Videos</h2>
    <p>Discover new videos every day.</p>
</div>

</body>
</html>
